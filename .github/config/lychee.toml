# Lychee configuration file
# See https://lychee.cli.rs/config/

timeout = 30
retry_wait_time = 5
max_retries = 6
max_concurrency = 4

# Check link anchors. Lychee 0.24+ expects a mode string here.
include_fragments = "full"

# Type anchors are generated by JavaScript. Check the page without its fragment.
remap = [
  '^https://opentelemetry\.io/docs/specs/otel-config/types/#.*$ https://opentelemetry.io/docs/specs/otel-config/types/',
]

# excluding links to pull requests and issues is done for performance
exclude = [
  "^https://github.com/open-telemetry/opentelemetry-java/(issues|pull)/\\d+$",
  "^https://www.javadoc.io/badge/(.*?)/(.*?).svg$", # returns 522
  "^https://cloud-native.slack.com/", # slack requires auth
]
