name: Zizmor

on:
  push:
    branches:
      - main
      - release/*
  pull_request:
  schedule:
    - cron: '43 18 * * 5' # weekly at 18:43 UTC on Friday
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read # for actions/checkout
      security-events: write # for zizmor to upload SARIF results
    uses: open-telemetry/shared-workflows/.github/workflows/zizmor.yml@68c7b2f0ef9cd9c1e2b71d3018f63127be189578 # v0.14.0
