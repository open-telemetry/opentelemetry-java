name: Dependency submission experiment

on:
  push:
    branches:
      - trask-renovate-update-investigation
    paths:
      - .github/workflows/dependency-submission-experiment.yml

permissions:
  contents: read

jobs:
  dependency-submission:
    if: github.repository == 'trask/opentelemetry-java'
    name: Dependency graph (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: full
            handling: generate-submit-and-upload
            configurations: ""
            excluded-projects: ""
          - profile: runtime
            handling: generate-and-upload
            configurations: "^runtimeClasspath$"
            excluded-projects: "^:buildSrc(:.*)?$"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - name: Generate dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true
          additional-arguments: --no-configuration-cache --no-parallel --no-scan
          dependency-graph: ${{ matrix.handling }}
          dependency-graph-include-configurations: ${{ matrix.configurations }}
          dependency-graph-exclude-projects: ${{ matrix.excluded-projects }}
          artifact-retention-days: 7
