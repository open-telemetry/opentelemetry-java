name: Build (daily)

on:
  schedule:
    # daily at 3:24 UTC
    - cron: "24 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    if: github.repository == 'open-telemetry/opentelemetry-java'
    uses: $/.github/workflows/reusable-link-check.yml

  publish-snapshots:
    if: github.repository == 'open-telemetry/opentelemetry-java'
    environment: protected
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Publish to Sonatype
        run: ./gradlew assemble publishToSonatype
        env:
          SONATYPE_USER: ${{ secrets.SONATYPE_USER }}
          SONATYPE_KEY: ${{ secrets.SONATYPE_KEY }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
          # disable gradle build cache, ensuring we're building from source to mitigate supply chain risk
          DISABLE_REMOTE_BUILD_CACHE: true

  workflow-notification:
    permissions:
      issues: write
    needs:
      - link-check
      - publish-snapshots
    if: always()
    uses: open-telemetry/shared-workflows/.github/workflows/workflow-failure-issue.yml@68c7b2f0ef9cd9c1e2b71d3018f63127be189578 # v0.14.0
    with:
      success: >-
        ${{
          needs.link-check.result == 'success' &&
          needs.publish-snapshots.result == 'success'
        }}
