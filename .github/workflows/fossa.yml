name: FOSSA

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fossa:
    if: github.repository == 'open-telemetry/opentelemetry-java'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: fossas/fossa-action@29693cc50323968e039056be419b32989fc5880c # v2.0.0
        with:
          api-key: ${{secrets.FOSSA_API_KEY}}
          team: OpenTelemetry

  workflow-notification:
    permissions:
      issues: write
    needs:
      - fossa
    if: always()
    uses: open-telemetry/shared-workflows/.github/workflows/workflow-failure-issue.yml@cb9f45f0b1ec545091caca504fc3e9b073284325 # v0.20.0
    with:
      success: ${{ needs.fossa.result == 'success' }}
